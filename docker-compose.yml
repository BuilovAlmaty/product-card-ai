services:
  db:
    image: pgvector/pgvector:pg16
    container_name: product-card-db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: card
      RABBITMQ_DEFAULT_PASS: card
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
  

volumes:
  postgres_data: